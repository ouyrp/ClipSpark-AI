[project]
name = "clipspark-api"
version = "0.1.0"
description = "ClipSpark AI FastAPI backend"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "python-multipart>=0.0.9",
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "celery>=5.4.0",
  "redis>=5.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"
